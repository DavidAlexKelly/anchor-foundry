# ============================================================================
# Customer bootstrap template (spec §6 "The Bootstrap IAM Role").
#
# The ONE piece of setup the customer performs manually: a tiny template that
# creates an IAM role in their account trusting our control plane role, with
# an external ID (unique per customer, secret) to prevent confused-deputy
# attacks. Used only for: initial provisioning, version updates, and stack
# destroy. Day-to-day platform operation uses the minimal-privilege roles the
# CDK stack itself provisions.
# ============================================================================
AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Platform bootstrap role. Grants the platform control plane permission to
  provision and update the platform stack in this account. Delete this stack
  to revoke all control plane access.

Parameters:
  ControlPlaneRoleArn:
    Type: String
    Description: ARN of the platform control plane role (provided during onboarding).
    AllowedPattern: "^arn:aws:iam::[0-9]{12}:role/.+$"
  ExternalId:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Unique secret external ID from your onboarding page. Prevents confused-deputy attacks.

Resources:
  PlatformBootstrapRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: platform-bootstrap
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref ControlPlaneRoleArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      Policies:
        - PolicyName: platform-provisioning
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # CloudFormation/CDK deploy of the platform stack only.
              - Sid: CloudFormation
                Effect: Allow
                Action:
                  - cloudformation:*
                Resource:
                  - !Sub "arn:aws:cloudformation:*:${AWS::AccountId}:stack/PlatformStack*/*"
                  - !Sub "arn:aws:cloudformation:*:${AWS::AccountId}:stack/CDKToolkit/*"
              # CDK asset staging bucket + ECR.
              - Sid: CdkAssets
                Effect: Allow
                Action:
                  - s3:*
                Resource:
                  - "arn:aws:s3:::cdk-*"
                  - "arn:aws:s3:::cdk-*/*"
              - Sid: CdkBootstrapRoles
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:PassRole
                  - sts:AssumeRole
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/cdk-*"
              - Sid: CdkBootstrapSsm
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:PutParameter
                Resource:
                  - !Sub "arn:aws:ssm:*:${AWS::AccountId}:parameter/cdk-bootstrap/*"
              # Cost transparency (spec §12): read-only billing access so the
              # platform can show the customer their own infrastructure costs.
              - Sid: CostExplorerReadOnly
                Effect: Allow
                Action:
                  - ce:GetCostAndUsage
                  - ce:GetCostForecast
                  - ce:GetTags
                Resource: "*"
              # One-time account prerequisite for the VPC-joined OpenSearch
              # domain the platform stack provisions: AWS doesn't create
              # this service-linked role automatically outside the console,
              # so the control plane creates it (idempotently) before the
              # first deploy in a fresh account.
              - Sid: OpenSearchServiceLinkedRole
                Effect: Allow
                Action:
                  - iam:CreateServiceLinkedRole
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/aws-service-role/opensearchservice.amazonaws.com/AWSServiceRoleForAmazonOpenSearchService"
                Condition:
                  StringEquals:
                    iam:AWSServiceName: opensearchservice.amazonaws.com
              # Stack teardown (control plane Deprovisioner): CloudFormation
              # itself is already covered by the CloudFormation statement
              # above, but two of the stack's stateful resources are
              # deliberately excluded from that (deletionProtection: true on
              # RDS, removalPolicy: RETAIN on the OpenSearch domain and both
              # S3 buckets - see infra/cdk/src/constructs/data-stores.ts) so
              # they survive an accidental/failed stack deletion. Teardown
              # has to reach past CloudFormation for exactly these four
              # resources. Scoped to the "platformstack-*" name prefix
              # CloudFormation auto-generates for every resource in this
              # stack (same STACK_NAME="PlatformStack" the CloudFormation
              # statement above is already scoped to) - this account only
              # ever hosts one platform stack, so this is precise, not
              # merely conventional.
              - Sid: TeardownRds
                Effect: Allow
                Action:
                  - rds:ModifyDBInstance
                  - rds:DescribeDBInstances
                  # Deleted directly, not left to CloudFormation's delete-stack:
                  # CloudFormation checks its own template's last-declared
                  # DeletionProtection (still true) rather than the live value
                  # ModifyDBInstance above just cleared, and silently skips
                  # deleting the instance instead - confirmed against a real
                  # stack (see deprovisioner.py's module docstring).
                  - rds:DeleteDBInstance
                Resource:
                  - !Sub "arn:aws:rds:*:${AWS::AccountId}:db:platformstack-*"
              - Sid: TeardownStorage
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                  - s3:GetBucketVersioning
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  - s3:DeleteBucket
                Resource:
                  - "arn:aws:s3:::platformstack-*"
                  - "arn:aws:s3:::platformstack-*/*"
              - Sid: TeardownSearch
                Effect: Allow
                Action:
                  - es:DescribeDomain
                  - es:DeleteDomain
                Resource:
                  - !Sub "arn:aws:es:*:${AWS::AccountId}:domain/platformstack-*"

Outputs:
  BootstrapRoleArn:
    Description: Paste this ARN back into the onboarding page.
    Value: !GetAtt PlatformBootstrapRole.Arn
