# The worker's Dagster instance (§883), copied to $DAGSTER_HOME by the
# Dockerfile. Its storage is SQLite on the task's own disk, which a deploy
# replaces; everything the platform needs to keep is in Postgres.
telemetry:
  enabled: false
# One event log for every run, rather than Dagster's default of a file per
# run: 35 KB a run instead of 150, and a deleted run's pages are reused, so
# `jobs/dagster_runs.py`'s pruning keeps it at about a day's size.
event_log_storage:
  module: dagster._core.storage.event_log
  class: ConsolidatedSqliteEventLogStorage
  config:
    base_dir: /opt/dagster/home/history/
# An op's output goes to the container's stdout, and so to CloudWatch with
# the rest of the worker's lines, rather than to files under $DAGSTER_HOME
# that nothing reads and nothing removes.
compute_logs:
  module: dagster._core.storage.noop_compute_log_manager
  class: NoOpComputeLogManager
# Schedule ticks: thousands a day.
retention:
  schedule:
    purge_after_days:
      skipped: 1
      success: 1
      failure: 7
# At most four runs at once (§888), and at most two of the jobs that work
# datasets in this process (§894: `definitions.HEAVY`). §894 measured the
# daemon and its code server at about 290 MB and each run's process at about
# 160 MB; a heavy run adds a DuckDB that may be resident at up to one and a
# half times its 512 MiB limit (§875). infra/cdk's scaling-check holds the
# worker's task size to that sum, reading these two numbers from this file.
# The rest wait in Dagster's queue, and `definitions.one_at_a_time` keeps a
# job from queueing behind itself.
run_coordinator:
  module: dagster._core.run_coordinator.queued_run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 4
    tag_concurrency_limits:
      - key: anchor/weight
        value: heavy
        limit: 2
