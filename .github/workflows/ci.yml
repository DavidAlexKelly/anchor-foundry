name: checks

# Deliberately thin. Every command lives in scripts/check.sh and
# scripts/dev-up.sh, which are run locally on every change - a workflow that
# inlined its own commands would be a second copy that nobody runs until it
# fails, and the two would drift on the first change to either.
#
# Honest status: this workflow ran for the first time on PR #50 and was red
# for nineteen runs, on one cause - see the PLATFORM_APP_PASSWORD note on the
# Migrate steps. Everything it checks had been passing locally the whole time,
# which is exactly why "verified locally" is not a substitute for a run.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 20
      # §268. `test_mysql_connector.py` is the file that proves the connector
      # interface generalises rather than being a rename of the Postgres path,
      # and it had skipped in every environment this project runs - locally
      # because nothing provisions a MariaDB, here because this job had only a
      # Postgres service. Twenty-odd tests reported as a clean pass without
      # executing. Root rather than a named user because the suite creates its
      # own database and login role, which is the arrangement that lets it hold
      # the credential boundary it exists to hold.
      #
      # **Two servers, because `ssl_mode` has two halves and one server cannot
      # show both.** The connector must refuse a session that finished in
      # plaintext, which needs a build with no certificates, and it must
      # actually encrypt one where the server can, which needs a build that
      # has them. MariaDB 11.4 started generating a self-signed pair at first
      # start, which is what turned the first test red the moment this job
      # began running it - the assertion had been written against an image
      # without them and nothing re-checked for as long as it never ran.
      mariadb:
        # Pinned below 11.4 deliberately: this is the plaintext server.
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: devpass
          MARIADB_ROOT_HOST: "%"
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mariadb_tls:
        # 11.4+ generates certificates at first start, so this one has TLS.
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: devpass
          MARIADB_ROOT_HOST: "%"
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://platform_app:devpass@localhost:5432/platform?sslmode=disable
      TEST_ADMIN_DSN: postgresql://platform:devpass@localhost:5432/platform?sslmode=disable
      STORAGE_ROOT: /tmp/anchor-storage
      ANCHOR_PYTHON: python
      TEST_MYSQL_ADMIN_USER: root
      TEST_MYSQL_ADMIN_PASSWORD: devpass
      TEST_MYSQL_TLS_PORT: "3307"
      # A missing MariaDB is the bug here, not a reason to skip - the same
      # sentence the browser job makes with ANCHOR_E2E_REQUIRED, and for the
      # same reason: without it, a service that failed to start would put the
      # suite back to reporting a pass it never earned.
      ANCHOR_MYSQL_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r apps/api/requirements.txt -r apps/api/requirements-dev.txt
      # Two overrides for this step, both found by running it rather than
      # reading it:
      #   * **the owner role, not the app role** - `migrate.py` reads
      #     DATABASE_URL, and the app role the other steps use is *created by*
      #     migration 0006, so on a fresh database the first connection fails
      #     before any migration runs;
      #   * **a plain libpq URL** - `migrate.py` talks to psycopg directly and
      #     rejects SQLAlchemy's `postgresql+psycopg://` scheme outright.
      - name: Migrate
        run: python packages/db/migrate.py
        env:
          DATABASE_URL: postgresql://platform:devpass@localhost:5432/platform?sslmode=disable
          # **The role's password is not the one anything connects with.**
          # 0006_rls.sql creates platform_app with a fixed placeholder, because
          # migrations are checksummed and cannot carry a per-deployment
          # secret. `migrate.py` reconciles it from PLATFORM_APP_PASSWORD, and
          # locally `scripts/setup.sh` is what arranges for that to happen -
          # a script CI has no reason to run. So every job here connected as
          # platform_app with `devpass` against a role whose password was still
          # `change_me_in_secrets_manager`, and nineteen runs failed on
          # "password authentication failed for user platform_app" while the
          # same suites stayed green on every developer machine.
          PLATFORM_APP_PASSWORD: devpass
      - run: scripts/check.sh api

  # §263. There was no worker job because there was no worker target, and there
  # was no worker target because nothing installed what the worker's 78 tests
  # need - three absences that each explained the next and none of which
  # announced itself. `check.sh worker` creates and migrates its own database,
  # so this job needs no Migrate step of its own: the worker's suite must never
  # share a database with anything, because its discovery functions are
  # RLS-blind and act on every workspace they can see.
  worker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://platform_app:devpass@localhost:5432/platform?sslmode=disable
      TEST_ADMIN_DSN: postgresql://platform:devpass@localhost:5432/platform?sslmode=disable
      STORAGE_ROOT: /tmp/anchor-storage
      ANCHOR_PYTHON: python
      # The same note as the api job's Migrate step, and the reason nineteen
      # runs were red: 0006_rls.sql creates platform_app with a checksummed
      # placeholder password, and `migrate.py` is what reconciles it.
      PLATFORM_APP_PASSWORD: devpass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r apps/worker/requirements.txt -r apps/worker/requirements-dev.txt
      - run: scripts/check.sh worker

  types:
    name: types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: scripts/check.sh types
      - run: scripts/check.sh unit

  # The browser suite needs the whole stack, so it is its own job rather than a
  # step on one of the above: a failure here means something a viewer would
  # see, and reading that off a job whose name is "api" helps nobody.
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://platform_app:devpass@localhost:5432/platform?sslmode=disable
      TEST_ADMIN_DSN: postgresql://platform:devpass@localhost:5432/platform?sslmode=disable
      STORAGE_ROOT: /tmp/anchor-storage
      ANCHOR_PYTHON: python
      # A missing stack is the bug here, not a reason to skip.
      ANCHOR_E2E_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: pip install -r apps/api/requirements.txt -r apps/api/requirements-dev.txt
      - run: npm ci
      # The package is pinned in requirements-dev.txt; this fetches the
      # browser binary, which pip cannot.
      - run: python -m playwright install --with-deps chromium
      # Same two overrides as the api job; see there for why.
      - name: Migrate
        run: python packages/db/migrate.py
        env:
          DATABASE_URL: postgresql://platform:devpass@localhost:5432/platform?sslmode=disable
          # **The role's password is not the one anything connects with.**
          # 0006_rls.sql creates platform_app with a fixed placeholder, because
          # migrations are checksummed and cannot carry a per-deployment
          # secret. `migrate.py` reconciles it from PLATFORM_APP_PASSWORD, and
          # locally `scripts/setup.sh` is what arranges for that to happen -
          # a script CI has no reason to run. So every job here connected as
          # platform_app with `devpass` against a role whose password was still
          # `change_me_in_secrets_manager`, and nineteen runs failed on
          # "password authentication failed for user platform_app" while the
          # same suites stayed green on every developer machine.
          PLATFORM_APP_PASSWORD: devpass
      - name: Bring the stack up
        run: scripts/dev-up.sh
      - run: scripts/check.sh e2e
      - name: Server logs on failure
        if: failure()
        # **`-n 100`, not `-100`.** With two files GNU tail refuses the
        # obsolescent form — `tail: option used in invalid context -- 1` — so
        # this step has printed that message and nothing else on every red run
        # since it was written. §271 found it while trying to read the logs of a
        # browser job that had been failing for ten merges: the one step whose
        # whole job is to explain a failure had never explained one.
        run: tail -n 100 /tmp/anchor-dev/api.log /tmp/anchor-dev/web.log || true
